name: Issue Command

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  handle-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Handle /assign, /unassign, and /review commands
        uses: actions/github-script@v6
        with:
          script: |
            const eventName = context.eventName;
            let body, commenter, issueNumber;

            if (eventName === 'issue_comment') {
              body = context.payload.comment.body;
              commenter = context.payload.comment.user.login;
              issueNumber = context.issue.number;
            } else if (eventName === 'pull_request_target') {
              body = context.payload.pull_request.body;
              commenter = context.payload.pull_request.user.login;
              issueNumber = context.payload.pull_request.number;
            } else {
              return; // Should not happen based on triggers
            }

            // If body is null (e.g. empty PR description), skip
            if (!body) return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Split into lines to handle multiple commands or mixed content
            const lines = body.split('\n');

            for (const line of lines) {
              const trimmedLine = line.trim();

              // ---------------------------------------------------------
              // /assign [me|@user]
              // ---------------------------------------------------------
              if (trimmedLine.startsWith('/assign')) {
                const args = trimmedLine.split(' ').filter(Boolean);
                let usersToAssign = [];

                if (args.length === 1 || (args.length === 2 && args[1] === 'me')) {
                  usersToAssign.push(commenter);
                } else if (args.length > 1) {
                   // Extract users starting with @
                   usersToAssign = args.slice(1)
                    .filter(arg => arg.startsWith('@'))
                    .map(arg => arg.substring(1));
                }

                if (usersToAssign.length > 0) {
                  try {
                    await github.rest.issues.addAssignees({
                      owner,
                      repo,
                      issue_number: issueNumber,
                      assignees: usersToAssign,
                    });

                    if (eventName === 'issue_comment') {
                        await github.rest.reactions.createForIssueComment({
                        owner,
                        repo,
                        comment_id: context.payload.comment.id,
                        content: 'rocket',
                        });
                    }
                  } catch (error) {
                    console.error(`Failed to assign users: ${error.message}`);
                    if (eventName === 'issue_comment') {
                        await github.rest.reactions.createForIssueComment({
                        owner,
                        repo,
                        comment_id: context.payload.comment.id,
                        content: 'confused',
                        });
                    }
                  }
                }
              }

              // ---------------------------------------------------------
              // /unassign [me]
              // ---------------------------------------------------------
              if (trimmedLine.startsWith('/unassign')) {
                try {
                  await github.rest.issues.removeAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: [commenter],
                  });
                   console.log(`Unassigned ${commenter} from issue #${issueNumber}`);
                   if (eventName === 'issue_comment') {
                       await github.rest.reactions.createForIssueComment({
                          owner,
                          repo,
                          comment_id: context.payload.comment.id,
                          content: '+1',
                        });
                    }
                } catch (error) {
                   console.error(`Failed to unassign user: ${error.message}`);
                }
              }

              // ---------------------------------------------------------
              // /review @user (PR only)
              // ---------------------------------------------------------
              if (trimmedLine.startsWith('/review') || trimmedLine.startsWith('/request-review')) {
                // Check if it's a PR.
                // context.payload.issue.pull_request exists for issue_comment on PRs.
                // context.payload.pull_request exists for pull_request events.
                const isPR = context.payload.pull_request || (context.payload.issue && context.payload.issue.pull_request);

                if (!isPR) {
                  console.log('Skipping /review command on non-PR issue.');
                  continue;
                }

                const args = trimmedLine.split(' ').filter(Boolean);
                const reviewers = args.slice(1)
                  .filter(arg => arg.startsWith('@'))
                  .map(arg => arg.substring(1));

                if (reviewers.length > 0) {
                  try {
                    await github.rest.pulls.requestReviewers({
                      owner,
                      repo,
                      pull_number: issueNumber,
                      reviewers: reviewers,
                    });
                    console.log(`Requested review from ${reviewers.join(', ')} on PR #${issueNumber}`);
                     if (eventName === 'issue_comment') {
                        await github.rest.reactions.createForIssueComment({
                        owner,
                        repo,
                        comment_id: context.payload.comment.id,
                        content: 'eyes',
                        });
                     }
                  } catch (error) {
                    console.error(`Failed to request review: ${error.message}`);
                     if (eventName === 'issue_comment') {
                        await github.rest.reactions.createForIssueComment({
                        owner,
                        repo,
                        comment_id: context.payload.comment.id,
                        content: 'confused',
                        });
                     }
                  }
                }
              }
            }
