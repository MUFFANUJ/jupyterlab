name: Documentation Spell Check

on:
  pull_request:
    paths:
      - '**.md'
      - '**.rst'
      - '**.txt'
      - 'docs/**'

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed documentation files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **.md
            **.rst
            **.txt
            docs/**
          files_ignore: |
            node_modules/**
            jupyterlab/staging/**
            packages/**/src/**
            packages/**/test/**
            packages/**/lib/**
            builder/**
            buildutils/**
            galata/**
            dev_mode/**
            examples/**
            testutils/**
            .yarn/**

      - name: Run codespell on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: codespell-project/actions-codespell@v2
        with:
          path: ${{ steps.changed-files.outputs.all_changed_files }}
          check_filenames: false
          skip: '*.min.js,*.map,*.lock,*.json,*.ipynb,*.svg,*.png,*.jpg,*.jpeg,*.gif,*.ico,*.woff,*.woff2,*.ttf,*.eot,*.pyc'
          ignore_words_file: .codespellignore
          only_warn: 0
