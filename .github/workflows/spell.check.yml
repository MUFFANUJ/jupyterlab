name: Documentation Spell Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - '*.rst'
      - '*.txt'
      - 'README*'
      - 'CHANGELOG*'
      - 'CONTRIBUTING*'

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Sparse checkout for efficiency on large repos
          fetch-depth: 1

      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          # Only scan documentation files (positive matching)
          path: docs README.md CHANGELOG.md CONTRIBUTING.md RELEASE.md CORPORATE.md

          check_filenames: false

          # Skip patterns for files that might be pulled in or referenced
          skip: >-
            node_modules,
            .git,
            jupyterlab/staging,
            packages/*/src,
            packages/*/test,
            packages/*/lib,
            packages/*/style,
            builder,
            buildutils,
            galata,
            dev_mode,
            examples,
            testutils,
            *.min.js,
            *.bundle.js,
            *.map,
            *.lock,
            *.json,
            *.ipynb,
            *.svg,
            *.png,
            *.jpg,
            *.jpeg,
            *.gif,
            *.ico,
            *.woff,
            *.woff2,
            *.ttf,
            *.eot,
            *.pyc,
            yarn.lock,
            package-lock.json,
            __pycache__,
            .yarn

          ignore_words_file: .codespellignore
          only_warn: 0
